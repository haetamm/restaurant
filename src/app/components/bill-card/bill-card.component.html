<div
  class="bg-white border border-gray-100 rounded-lg shadow-sm hover:shadow-md transition-shadow duration-200 p-5 mb-3"
>
  <div class="flex flex-col space-y-4">
    <!-- Header Row -->
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <button
          class="p-1 rounded-full hover:bg-gray-50 transition-colors duration-200"
          pTooltip="Refresh data"
          tooltipPosition="right"
          (click)="updateBill(bill.id, bill.payment)"
        >
          <i
            [ngClass]="
              selectPaymentDisabled(bill.payment)
                ? 'text-gray-300'
                : 'text-gray-600 font-medium'
            "
            class="pi pi-refresh transition-colors duration-200"
          ></i>
        </button>
        <span class="text-sm font-medium text-gray-500">
          {{ formatDate(bill.transDate) }}
        </span>
      </div>
      <span
        class="px-2 py-1 text-xs rounded-full"
        [ngClass]="{
          'bg-green-100 text-green-800':
            bill.payment.transactionStatus === 'settlement',
          'bg-yellow-100 text-yellow-800':
            bill.payment.transactionStatus === 'pending',
          'bg-red-100 text-red-800':
            bill.payment.transactionStatus === 'expire',
        }"
      >
        {{ bill.payment.transactionStatus }}
      </span>
    </div>

    <!-- Content Section -->
    <div class="flex flex-col">
      <ng-container *ngIf="!isUser; else justText">
        <a
          [routerLink]="[urlPage.CUSTOMER]"
          [queryParams]="{ name: bill.customerName }"
          class="text-blue-600 hover:text-blue-800 font-medium transition-colors duration-200"
        >
          {{ bill.customerName }}
        </a>
      </ng-container>

      <ng-template #justText>
        <span class="text-gray-800 font-medium">
          {{ getMenuNames(bill) }}
        </span>
      </ng-template>
    </div>

    <!-- Footer Section -->
    <div
      class="flex justify-between items-center pt-2 border-t border-gray-100"
    >
      <div class="flex flex-col">
        <span class="text-xs text-gray-500">Total Bayar</span>
        <div class="flex items-center space-x-4">
          <span class="text-lg font-bold text-gray-900">
            Rp. {{ bill.totalPayment | number: "1.0-0" }}
          </span>
          <button
            (click)="
              handleSelectPayment(bill.payment.redirectUrl, bill.payment)
            "
            [ngClass]="
              selectPaymentDisabled(bill.payment)
                ? 'text-blue-300'
                : 'text-blue-600 font-medium'
            "
            class="flex items-center space-x-1 text-sm transition-colors duration-200"
          >
            <i class="pi pi-wallet text-sm"></i>
            <span>Bayar</span>
          </button>
        </div>
      </div>
      <button
        (click)="selectBillDetail(bill.id)"
        class="flex items-center space-x-1 px-3 py-1.5 text-sm font-medium rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors duration-200"
      >
        <i class="pi pi-info-circle text-sm"></i>
        <span>Detail</span>
      </button>
    </div>
  </div>
</div>
