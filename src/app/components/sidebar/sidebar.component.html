<div
  class="h-screen w-64 md:w-[170px] lg:w-[200px] bg-white shadow-md md:flex flex-col transform md:animate-show-sidebar-1"
  id="sidebar"
>
  <!-- Logo -->
  <div class="p-2 lg:p-4 flex items-center">
    <img
      src="/img/logo.png"
      class="w-8 h-8 flex items-center justify-center text-white font-bold"
    />
    <a
      [routerLink]="[urlPage.WELCOME]"
      class="ml-2 text-xl font-semibold text-orange-500"
      >Warmakth</a
    >
  </div>

  <div
    class="flex flex-col md:justify-between h-full overflow-auto no-scrollbar"
  >
    <div>
      <app-avatar />
      <nav class="p-4">
        <ul class="space-y-2">
          <li *ngFor="let item of navItems">
            <a
              (click)="closeSidebar()"
              [routerLink]="item.link"
              [ngClass]="{
                'bg-gray-100 text-orange-500': isRouteActive(item.link),
                'text-gray-600': !isRouteActive(item.link),
              }"
              class="flex items-center p-2 rounded-lg text-gray-600 hover:bg-gray-100 relative"
            >
              <ng-icon [name]="item.icon" class="w-5 h-5 mr-2" />
              {{ item.label }}
              <!-- Tambahkan badge untuk notifikasi -->
              <span
                *ngIf="item.showBadge && unReadCount > 0"
                class="absolute right-2 inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-white bg-red-500 rounded-full"
              >
                {{ unReadCount }}
              </span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="px-4 pb-2">
      <button
        (click)="handleLogout()"
        class="flex items-center w-full cursor-pointer p-2 text-red-500 hover:bg-red-100 rounded-lg"
      >
        <ng-icon name="bootstrapBoxArrowLeft" class="w-5 h-5 mr-2" />
        Logout
      </button>
    </div>
  </div>
</div>
