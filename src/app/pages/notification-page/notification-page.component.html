<div class="w-full bg-auth-layout">
  <!-- Sticky Header -->
  <div
    class="p-3 md:p-2.5 lg:p-4.5 sticky top-0 z-50 w-full flex items-center justify-between bg-white border-b border-gray-200"
  >
    <div class="w-full">
      <p class="font-bold text-lg">Notifikasi</p>
    </div>
  </div>

  <!-- Content Area -->
  <div class="min-h-[calc(100vh-4rem)] px-2 lg:px-4 overflow-y-auto mt-4">
    <ng-container *ngIf="loading; else showNotifications">
      <div
        *ngFor="let i of [1, 2, 3, 4, 5]"
        class="mb-3 h-[250px] sm:h-[180px] lg:h-[150px] w-full rounded-xl overflow-hidden"
      >
        <p-skeleton width="100%" height="100%" styleClass="w-full h-full " />
      </div>
    </ng-container>

    <ng-template #showNotifications>
      <ng-container *ngIf="paginated.length > 0; else noData">
        <app-notification-card
          *ngFor="let notification of paginated"
          [notification]="notification"
        />
      </ng-container>
    </ng-template>

    <ng-template #noData>
      <div class="text-center py-10 text-gray-400">
        Tidak ada notifikasi tersedia.
      </div>
    </ng-template>

    <!-- Pagination -->
    <p-paginator
      *ngIf="paginated.length"
      [rows]="rows"
      [totalRecords]="notifications.length"
      [first]="first"
      (onPageChange)="paginate($event)"
      styleClass="my-4"
    />
  </div>
</div>
